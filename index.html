<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OLX Авто">
<meta name="theme-color" content="#08080e">
<title>OLX Авто</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #08080e;
  --s1:      #111119;
  --s2:      #181824;
  --s3:      #1f1f2e;
  --border:  #28283c;
  --accent:  #7b6fff;
  --a-glow:  rgba(123,111,255,.22);
  --green:   #3de89b;
  --text:    #ededf4;
  --muted:   #5e5e78;
  --r:       15px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
}

/* ─── BACKGROUND ─────────────────────────────────────── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 55% at 10% -5%,  rgba(123,111,255,.20) 0%, transparent 55%),
    radial-gradient(ellipse 55% 60% at 90%  95%, rgba(61,232,155,.08)  0%, transparent 55%),
    radial-gradient(ellipse 45% 45% at 85%  10%, rgba(255,90,130,.07)  0%, transparent 50%);
}
body::after {
  content: '';
  position: fixed; z-index: 0; pointer-events: none;
  width: 380px; height: 380px; border-radius: 50%;
  background: radial-gradient(circle, rgba(123,111,255,.07) 0%, transparent 70%);
  top: 38%; left: 50%; transform: translate(-50%,-50%);
  animation: orb 9s ease-in-out infinite;
}
@keyframes orb {
  0%,100% { transform: translate(-50%,-50%) scale(1);    }
  50%      { transform: translate(-50%,-62%) scale(1.14); }
}

/* ─── GRID TEXTURE ───────────────────────────────────── */
.grid-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: .045;
}
.grid-bg svg { width: 100%; height: 100%; }

/* ─── PAGE ───────────────────────────────────────────── */
.page {
  position: relative; z-index: 1;
  max-width: 480px; margin: 0 auto;
  padding: 0 16px 130px;
}

/* ─── HEADER ─────────────────────────────────────────── */
.header {
  padding: 56px 0 32px;
  padding-top: calc(56px + env(safe-area-inset-top));
}
.header-sup {
  font-family: 'Syne', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: .22em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px;
}
.header-sup::before {
  content: '';
  display: inline-block;
  width: 18px; height: 2px;
  background: var(--accent); border-radius: 1px;
}
.header h1 {
  font-family: 'Syne', sans-serif;
  font-size: 42px; font-weight: 800; line-height: 1;
  background: linear-gradient(140deg, #ffffff 0%, #b8b4ff 50%, #7b6fff 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ─── SECTION ────────────────────────────────────────── */
.sec { margin-bottom: 28px; }
.sec-title {
  font-family: 'Syne', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 12px;
}

/* ─── CARD WRAP (glassmorphism) ──────────────────────── */
.card {
  background: rgba(17,17,25,.7);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 20px;
  padding: 6px;
  margin-bottom: 12px;
  box-shadow:
    0 4px 24px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.06);
}

/* ─── INPUT FIELD ────────────────────────────────────── */
.field-wrap { position: relative; }
.field-wrap + .field-wrap { margin-top: 2px; }

.field {
  width: 100%;
  background: transparent;
  border: none;
  border-radius: 14px;
  padding: 15px 48px 15px 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 16px; font-weight: 400;
  color: var(--text);
  outline: none; -webkit-appearance: none;
  transition: background .18s;
}
.field::placeholder { color: var(--muted); }
.field:focus { background: rgba(123,111,255,.08); }
.field:disabled { opacity: .3; pointer-events: none; }

.field-sep {
  height: 1px;
  background: rgba(255,255,255,.06);
  margin: 0 16px;
}

.field-ico {
  position: absolute; right: 16px; top: 50%;
  transform: translateY(-50%);
  font-size: 17px; pointer-events: none;
  opacity: .55;
}

/* ─── DROPDOWN (fixed overlay) ───────────────────────── */
#dropOverlay {
  display: none; position: fixed; inset: 0; z-index: 1000;
}
#dropOverlay.open { display: block; }

#dropBox {
  position: fixed;
  background: rgba(22,22,34,.97);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 16px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  box-shadow: 0 20px 60px rgba(0,0,0,.75), 0 0 0 1px rgba(123,111,255,.08);
  z-index: 1001;
  animation: dropIn .18s ease both;
}
@keyframes dropIn {
  from { opacity: 0; transform: translateY(-6px) scale(.98); }
  to   { opacity: 1; transform: translateY(0)    scale(1);   }
}

.drop-item {
  padding: 13px 16px;
  font-size: 15px; color: var(--text);
  border-bottom: 1px solid rgba(255,255,255,.04);
  cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  -webkit-user-select: none;
  transition: background .1s;
}
.drop-item:last-child { border-bottom: none; }
.drop-item .di { font-size: 13px; opacity: .35; flex-shrink: 0; }
.drop-item:active,
.drop-item.hl { background: rgba(123,111,255,.16); color: #ccc6ff; }

.drop-empty {
  padding: 18px 16px; text-align: center;
  color: var(--muted); font-size: 14px;
}

/* ─── FILTER CHIPS ───────────────────────────────────── */
.filter-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.no-filters { color: var(--muted); font-size: 13px; text-align: center; padding: 12px 0; }

.f-chip {
  background: rgba(17,17,25,.7);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 16px;
  padding: 13px 14px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer;
  position: relative; overflow: hidden;
  transition: border-color .18s, background .18s;
  box-shadow: 0 2px 12px rgba(0,0,0,.25);
}
.f-chip::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--green));
  opacity: 0; transition: opacity .18s; border-radius: 0 2px 2px 0;
}
.f-chip.on { border-color: rgba(123,111,255,.4); background: rgba(123,111,255,.08); }
.f-chip.on::before { opacity: 1; }

.f-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background .18s; }
.f-chip.on .f-dot { background: var(--accent); box-shadow: 0 0 8px var(--a-glow); }

.f-info { flex: 1; min-width: 0; }
.f-name { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f-desc { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.f-btns { display: flex; gap: 5px; flex-shrink: 0; }
.f-btn {
  width: 30px; height: 30px; border-radius: 9px; border: none;
  background: rgba(255,255,255,.05); color: var(--muted);
  font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .12s;
}
.f-btn:active { background: rgba(255,255,255,.12); }

/* ─── ADD BUTTON ─────────────────────────────────────── */
.btn-add {
  width: 100%;
  background: rgba(17,17,25,.5);
  border: 1.5px dashed rgba(255,255,255,.12);
  border-radius: 16px;
  padding: 14px;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif; font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: border-color .15s, color .15s, background .15s;
}
.btn-add:active { border-color: var(--accent); color: var(--accent); background: rgba(123,111,255,.06); }

/* ─── SEARCH BUTTON ──────────────────────────────────── */
.search-btn {
  position: fixed;
  bottom: calc(22px + env(safe-area-inset-bottom));
  left: 50%; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 448px;
  background: linear-gradient(135deg, #6c63ff 0%, #a89bff 100%);
  border: none; border-radius: 20px;
  padding: 19px;
  font-family: 'Syne', sans-serif;
  font-size: 16px; font-weight: 800;
  color: #fff; letter-spacing: .05em;
  cursor: pointer;
  box-shadow: 0 10px 36px rgba(108,99,255,.45), 0 2px 8px rgba(0,0,0,.3);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .16s, box-shadow .16s, opacity .16s;
  z-index: 100;
}
.search-btn::before {
  content: '';
  position: absolute; inset: 0; border-radius: 20px;
  background: linear-gradient(180deg, rgba(255,255,255,.15) 0%, transparent 100%);
  pointer-events: none;
}
.search-btn:active  { transform: translateX(-50%) scale(.97); box-shadow: 0 4px 16px rgba(108,99,255,.3); }
.search-btn:disabled { background: var(--s2); box-shadow: none; color: var(--muted); }
.search-btn:disabled::before { display: none; }

/* ─── MODAL ──────────────────────────────────────────── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 500;
  align-items: flex-end; justify-content: center;
}
.modal-bg.open { display: flex; }

.modal-sheet {
  background: rgba(16,16,24,.98);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 28px 28px 0 0;
  width: 100%; max-width: 480px;
  max-height: 90vh;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 20px 18px 0;
  padding-bottom: calc(28px + env(safe-area-inset-bottom));
  box-shadow: 0 -8px 48px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  animation: sheetUp .3s cubic-bezier(.32,1.22,.64,1) both;
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-handle {
  width: 36px; height: 4px;
  background: rgba(255,255,255,.12); border-radius: 2px;
  margin: 0 auto 20px;
}
.modal-title {
  font-family: 'Syne', sans-serif;
  font-size: 22px; font-weight: 800;
  background: linear-gradient(135deg, #fff 30%, #b0a8ff 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 20px;
}

/* Name field */
.name-label {
  font-size: 10px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
  color: #a09aff; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.name-field {
  width: 100%;
  background: rgba(123,111,255,.1);
  border: 1.5px solid rgba(123,111,255,.45);
  border-radius: var(--r); padding: 15px 16px;
  font-family: 'DM Sans', sans-serif; font-size: 16px;
  color: var(--text); outline: none; -webkit-appearance: none;
  margin-bottom: 18px;
}
.name-field::placeholder { color: rgba(180,170,255,.35); }
.name-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(123,111,255,.15); }

.m-label {
  font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 7px; margin-top: 4px;
}
.m-field {
  width: 100%;
  background: var(--s2); border: 1px solid var(--border);
  border-radius: var(--r); padding: 13px 14px;
  font-family: 'DM Sans', sans-serif; font-size: 15px;
  color: var(--text); outline: none; -webkit-appearance: none; margin-bottom: 10px;
}
.m-field::placeholder { color: var(--muted); }
.m-field:focus { border-color: rgba(123,111,255,.5); background: rgba(123,111,255,.05); }

.m-row { display: flex; gap: 8px; margin-bottom: 10px; }
.m-row .m-field { margin-bottom: 0; flex: 1; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tag {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 10px; padding: 7px 13px;
  font-size: 13px; color: var(--text);
  cursor: pointer; transition: all .14s;
  -webkit-user-select: none;
}
.tag.on { background: rgba(123,111,255,.22); border-color: var(--accent); color: #ccc6ff; }
.tag:active { transform: scale(.95); }

.divider { height: 1px; background: rgba(255,255,255,.07); margin: 14px 0; }

.m-btn {
  width: 100%;
  background: linear-gradient(135deg, #6c63ff, #a89bff);
  border: none; border-radius: 16px; padding: 17px;
  font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800;
  color: #fff; cursor: pointer; margin-bottom: 8px;
  box-shadow: 0 6px 20px rgba(108,99,255,.35);
  position: relative; overflow: hidden;
}
.m-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.12) 0%, transparent 100%);
  pointer-events: none;
}
.m-btn:active { opacity: .85; transform: scale(.98); }

.m-btn-cancel {
  width: 100%; background: none;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 16px; padding: 14px;
  font-family: 'DM Sans', sans-serif; font-size: 15px;
  color: var(--muted); cursor: pointer; margin-bottom: 8px;
}

/* ─── TOAST ──────────────────────────────────────────── */
.toast {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top));
  left: 50%; transform: translateX(-50%) translateY(-80px);
  background: rgba(22,22,34,.96);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 12px; padding: 12px 20px;
  font-size: 13px; color: var(--text);
  z-index: 900; white-space: nowrap;
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: transform .3s cubic-bezier(.32,1.2,.64,1);
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ─── SCROLLBAR ──────────────────────────────────────── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ─── ANIMATIONS ─────────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.sec:nth-child(1) { animation: fadeUp .4s .05s both; }
.sec:nth-child(2) { animation: fadeUp .4s .12s both; }
.sec:nth-child(3) { animation: fadeUp .4s .19s both; }
.header { animation: fadeUp .5s .0s both; }
</style>
</head>
<body>

<!-- Grid texture -->
<div class="grid-bg">
  <svg xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width=".5"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#g)"/>
  </svg>
</div>

<!-- Dropdown overlay (fixed, above everything) -->
<div id="dropOverlay">
  <div id="dropBox"></div>
</div>

<!-- Main page -->
<div class="page">
  <div class="header">
    <div class="header-sup">Пошук авто</div>
    <h1>OLX<br>Авто</h1>
  </div>

  <div class="sec">
    <div class="sec-title">Марка та модель</div>
    <div class="card">
      <div class="field-wrap">
        <input class="field" id="brandInput" type="text" placeholder="Марка автомобіля…"
               autocomplete="off" autocorrect="off" spellcheck="false">
        <span class="field-ico">🚗</span>
      </div>
      <div class="field-sep"></div>
      <div class="field-wrap">
        <input class="field" id="modelInput" type="text" placeholder="Модель…"
               disabled autocomplete="off" autocorrect="off" spellcheck="false">
        <span class="field-ico">⚙️</span>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">Підбірки фільтрів</div>
    <div class="filter-list" id="filterList"></div>
    <button class="btn-add" id="addFilterBtn">＋ Нова підбірка фільтрів</button>
  </div>
</div>

<button class="search-btn" id="searchBtn" disabled>🔍 Шукати на OLX</button>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal-sheet" id="modalSheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Нова підбірка</div>

    <div class="name-label">✏️ Назва підбірки</div>
    <input class="name-field" id="mName" placeholder="Наприклад: До 5000$, дизель" autocomplete="off">

    <div class="m-label">Ціна (USD)</div>
    <div class="m-row">
      <input class="m-field" id="mPriceFrom" type="number" placeholder="від">
      <input class="m-field" id="mPriceTo"   type="number" placeholder="до">
    </div>

    <div class="m-label">Рік</div>
    <div class="m-row">
      <input class="m-field" id="mYearFrom" type="number" placeholder="від">
      <input class="m-field" id="mYearTo"   type="number" placeholder="до">
    </div>

    <div class="m-label">Пробіг (тис. км)</div>
    <div class="m-row">
      <input class="m-field" id="mMileFrom" type="number" placeholder="від">
      <input class="m-field" id="mMileTo"   type="number" placeholder="до">
    </div>

    <div class="m-label">Пальне</div>
    <div class="tags" id="fuelTags">
      <span class="tag" data-v="petrol">⛽ Бензин</span>
      <span class="tag" data-v="diesel">🛢 Дизель</span>
      <span class="tag" data-v="gas">💨 Газ</span>
      <span class="tag" data-v="hybrid">🔋 Гібрид</span>
      <span class="tag" data-v="electro">⚡ Електро</span>
    </div>

    <div class="m-label">КПП</div>
    <div class="tags" id="gearTags">
      <span class="tag" data-v="manual">🔧 Механіка</span>
      <span class="tag" data-v="automatic">🤖 Автомат</span>
    </div>

    <div class="m-label">Стан</div>
    <div class="tags" id="stateTags">
      <span class="tag" data-v="used">Вживані</span>
      <span class="tag" data-v="new">Нові</span>
    </div>

    <div class="divider"></div>
    <button class="m-btn"        id="saveBtn">Зберегти підбірку</button>
    <button class="m-btn-cancel" id="cancelBtn">Скасувати</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

const SLUGS = {
  "Audi":"audi","BMW":"bmw","Mercedes-Benz":"mercedes-benz","Toyota":"toyota",
  "Volkswagen":"volkswagen","Honda":"honda","Ford":"ford","Hyundai":"hyundai",
  "Kia":"kia","Opel":"opel","Renault":"renault","Peugeot":"peugeot","Mazda":"mazda",
  "Nissan":"nissan","Skoda":"skoda","Mitsubishi":"mitsubishi","Subaru":"subaru",
  "Volvo":"volvo","Lada (ВАЗ)":"vaz-lada","Chevrolet":"chevrolet","Daewoo":"daewoo",
  "Land Rover":"land-rover","Lexus":"lexus","Jeep":"jeep","Citroën":"citroen",
  "Fiat":"fiat","Alfa Romeo":"alfa-romeo","Seat":"seat","Porsche":"porsche",
  "Tesla":"tesla","Suzuki":"suzuki","Dacia":"dacia","ЗАЗ":"zaz",
  "BYD":"byd","Geely":"geely","Haval":"haval","Chery":"chery","MG":"mg",
};

// ── STATE ─────────────────────────────────────────────────────────────────────
let brand = null, model = null, activeFilter = null, editId = null;
let filters = [];
try { filters = JSON.parse(localStorage.getItem('olx_f') || '[]'); } catch(e){}

// ── ELEMENTS ──────────────────────────────────────────────────────────────────
const brandInput   = document.getElementById('brandInput');
const modelInput   = document.getElementById('modelInput');
const searchBtn    = document.getElementById('searchBtn');
const filterList   = document.getElementById('filterList');
const addFilterBtn = document.getElementById('addFilterBtn');
const modalBg      = document.getElementById('modalBg');
const dropOverlay  = document.getElementById('dropOverlay');
const dropBox      = document.getElementById('dropBox');
const toastEl      = document.getElementById('toast');

// ── DROPDOWN (fixed) ──────────────────────────────────────────────────────────
function openDrop(anchorEl, items, cb) {
  const rect = anchorEl.getBoundingClientRect();
  const gap = 6;
  const maxH = window.innerHeight - rect.bottom - gap - 16;

  dropBox.style.top    = (rect.bottom + gap) + 'px';
  dropBox.style.left   = rect.left + 'px';
  dropBox.style.width  = rect.width + 'px';
  dropBox.style.right  = 'auto';
  dropBox.style.maxHeight = Math.min(maxH, window.innerHeight * 0.46) + 'px';

  dropBox.innerHTML = items.length
    ? items.slice(0, 60).map(it =>
        `<div class="drop-item" data-v="${encodeURIComponent(it)}"><span class="di">›</span>${it}</div>`
      ).join('')
    : '<div class="drop-empty">Нічого не знайдено</div>';

  dropBox.querySelectorAll('.drop-item').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      closeDrop();
      cb(decodeURIComponent(el.dataset.v));
    });
  });

  dropOverlay.classList.add('open');
}

function closeDrop() {
  dropOverlay.classList.remove('open');
  dropBox.innerHTML = '';
}

dropOverlay.addEventListener('click', e => { if (e.target === dropOverlay) closeDrop(); });

// ── BRAND ─────────────────────────────────────────────────────────────────────
brandInput.addEventListener('focus', showBrandDrop);
brandInput.addEventListener('input', () => {
  brand = null; model = null;
  modelInput.value = ''; modelInput.disabled = true;
  updateBtn();
  showBrandDrop();
});

function showBrandDrop() {
  const q = brandInput.value.trim().toLowerCase();
  const list = q ? BRANDS.filter(b => b.toLowerCase().includes(q)) : BRANDS;
  openDrop(brandInput, list, val => {
    brand = val; brandInput.value = val;
    model = null; modelInput.value = ''; modelInput.disabled = false;
    updateBtn();
    setTimeout(() => modelInput.focus(), 80);
  });
}

// ── MODEL ─────────────────────────────────────────────────────────────────────
modelInput.addEventListener('focus', showModelDrop);
modelInput.addEventListener('input', () => {
  model = null; updateBtn();
  showModelDrop();
});

function showModelDrop() {
  if (!brand) return;
  const q = modelInput.value.trim().toLowerCase();
  const all = BM[brand] || [];
  const list = q ? all.filter(m => m.toLowerCase().includes(q)) : all;
  openDrop(modelInput, list, val => {
    model = val; modelInput.value = val;
    updateBtn();
  });
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function updateBtn() { searchBtn.disabled = !brand; }

searchBtn.addEventListener('click', () => {
  if (!brand) return;

  const brandSlug = SLUGS[brand] || brand.toLowerCase()
    .replace(/ї/g,'i').replace(/і/g,'i').replace(/є/g,'e').replace(/ё/g,'e')
    .replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');

  // Build search query: model + filter keywords
  const af = filters.find(f => f.id === activeFilter);
  const parts = [];
  if (model) parts.push(model);
  if (af) {
    const FL = {petrol:'бензин', diesel:'дизель', gas:'газ', hybrid:'гібрид', electro:'електро'};
    const GL = {manual:'механіка', automatic:'автомат'};
    (af.fuel||[]).forEach(v => { if(FL[v]) parts.push(FL[v]); });
    (af.gear||[]).forEach(v => { if(GL[v]) parts.push(GL[v]); });
    if (af.yearFrom && af.yearTo) parts.push(af.yearFrom + '-' + af.yearTo);
    else if (af.yearFrom) parts.push(af.yearFrom);
    else if (af.yearTo) parts.push(af.yearTo);
  }

  let url;
  if (parts.length > 0) {
    const q = encodeURIComponent(parts.join(' '));
    url = `https://www.olx.ua/uk/transport/legkovye-avtomobili/${brandSlug}/q-${q}/`;
  } else {
    url = `https://www.olx.ua/uk/transport/legkovye-avtomobili/${brandSlug}/`;
  }

  window.open(url, '_blank');
});

// ── FILTERS ───────────────────────────────────────────────────────────────────
function saveF() { try { localStorage.setItem('olx_f', JSON.stringify(filters)); } catch(e){} }

function desc(f) {
  const parts = [];
  if (f.priceFrom||f.priceTo) parts.push(`$${f.priceFrom||0}–$${f.priceTo||'∞'}`);
  if (f.yearFrom||f.yearTo)   parts.push(`${f.yearFrom||'–'}–${f.yearTo||'–'} р.`);
  const FL={petrol:'Бензин',diesel:'Дизель',gas:'Газ',hybrid:'Гібрид',electro:'Електро'};
  const GL={manual:'Механіка',automatic:'Автомат'};
  if (f.fuel?.length) parts.push(f.fuel.map(v=>FL[v]||v).join('/'));
  if (f.gear?.length) parts.push(f.gear.map(v=>GL[v]||v).join('/'));
  return parts.join(' · ');
}

function renderFilters() {
  if (!filters.length) {
    filterList.innerHTML = '<div class="no-filters">Підбірок поки немає</div>';
    return;
  }
  filterList.innerHTML = filters.map(f => `
    <div class="f-chip ${activeFilter===f.id?'on':''}" data-id="${f.id}">
      <div class="f-dot"></div>
      <div class="f-info">
        <div class="f-name">${f.name}</div>
        ${desc(f) ? `<div class="f-desc">${desc(f)}</div>` : ''}
      </div>
      <div class="f-btns">
        <button class="f-btn eb" data-id="${f.id}">✏️</button>
        <button class="f-btn db" data-id="${f.id}">🗑</button>
      </div>
    </div>`).join('');

  filterList.querySelectorAll('.f-chip').forEach(ch => {
    ch.addEventListener('click', e => {
      if (e.target.closest('.f-btn')) return;
      activeFilter = (activeFilter===ch.dataset.id) ? null : ch.dataset.id;
      renderFilters();
    });
  });
  filterList.querySelectorAll('.eb').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); openModal(filters.find(f=>f.id===b.dataset.id)); })
  );
  filterList.querySelectorAll('.db').forEach(b =>
    b.addEventListener('click', e => {
      e.stopPropagation();
      filters = filters.filter(f=>f.id!==b.dataset.id);
      if (activeFilter===b.dataset.id) activeFilter=null;
      saveF(); renderFilters(); showToast('Підбірку видалено');
    })
  );
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
addFilterBtn.addEventListener('click', () => openModal());
document.getElementById('cancelBtn').addEventListener('click', closeModal);
modalBg.addEventListener('click', e => { if (e.target===modalBg) closeModal(); });

function openModal(pre) {
  editId = pre?.id || null;
  document.getElementById('modalTitle').textContent = pre ? 'Редагувати' : 'Нова підбірка';
  document.getElementById('mName').value      = pre?.name       || '';
  document.getElementById('mPriceFrom').value = pre?.priceFrom  || '';
  document.getElementById('mPriceTo').value   = pre?.priceTo    || '';
  document.getElementById('mYearFrom').value  = pre?.yearFrom   || '';
  document.getElementById('mYearTo').value    = pre?.yearTo     || '';
  document.getElementById('mMileFrom').value  = pre?.mileFrom   || '';
  document.getElementById('mMileTo').value    = pre?.mileTo     || '';
  ['fuelTags','gearTags','stateTags'].forEach(id => {
    const key = id==='fuelTags'?'fuel':id==='gearTags'?'gear':'state';
    document.querySelectorAll(`#${id} .tag`).forEach(t =>
      t.classList.toggle('on', pre?.[key]?.includes(t.dataset.v)||false)
    );
  });
  document.getElementById('modalSheet').scrollTop = 0;
  modalBg.classList.add('open');
  setTimeout(() => document.getElementById('mName').focus(), 150);
}

function closeModal() { modalBg.classList.remove('open'); }

document.querySelectorAll('.tag').forEach(t =>
  t.addEventListener('click', () => t.classList.toggle('on'))
);

document.getElementById('saveBtn').addEventListener('click', () => {
  const name = document.getElementById('mName').value.trim();
  if (!name) { document.getElementById('mName').focus(); return; }
  const sel = id => [...document.querySelectorAll(`#${id} .tag.on`)].map(t=>t.dataset.v);
  const f = {
    id: editId || Date.now().toString(), name,
    priceFrom: document.getElementById('mPriceFrom').value,
    priceTo:   document.getElementById('mPriceTo').value,
    yearFrom:  document.getElementById('mYearFrom').value,
    yearTo:    document.getElementById('mYearTo').value,
    mileFrom:  document.getElementById('mMileFrom').value,
    mileTo:    document.getElementById('mMileTo').value,
    fuel:  sel('fuelTags'), gear: sel('gearTags'), state: sel('stateTags'),
  };
  if (editId) { const i=filters.findIndex(x=>x.id===editId); if(i>=0) filters[i]=f; }
  else filters.push(f);
  saveF(); renderFilters(); closeModal();
  showToast(editId ? 'Підбірку оновлено ✓' : 'Підбірку збережено ✓');
});

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastT;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderFilters();
updateBtn();
</script>
